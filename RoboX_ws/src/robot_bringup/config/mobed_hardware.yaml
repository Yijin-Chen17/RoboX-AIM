dm_lk_robox_chassis_controller:
  ros__parameters:
    robot_model: "robox_v2"

    # ==========================================================================
    # 极性与零位偏置（顺序固定为: [LF, RF, LB, RB]）
    # 实车安装方向或编码器零点与数学坐标系不同时，在此调整正负号与偏置(rad)
    # ==========================================================================
    steer_signs:   [1.0, 1.0, 1.0, 1.0]
    steer_offsets: [0.0, 0.0, 0.0, 0.0]

    ecc_signs:     [1.0, -1.0, 1.0, -1.0]
    ecc_offsets:   [3.141592653589793, 3.141592653589793, 3.141592653589793, 3.141592653589793]

    wheel_signs:   [-1.0, 1.0, -1.0, 1.0]

    # ==========================================================================
    # 达妙 DM-J4310P-2EC (转向) / DM-J4340P-2EC V1.1 (偏心) Position With Speed Limit 参数
    # ==========================================================================
    dm_steer_speed_limit: 12.0         # rad/s (DM-J4310P 额定 120 rpm = 12.57 rad/s)
    dm_ecc_speed_limit: 3.5            # rad/s (DM-J4340P 额定 36 rpm = 3.77 rad/s)

    # ==========================================================================
    # 瓴控 LK MF9010 V2 (17T, 24V) 轮毂电机 PI 闭环与广播电流参数
    # ==========================================================================
    wheel_speed_kp: 15.0               # Nm / (rad/s)
    wheel_speed_ki: 0.5                # Nm / rad
    wheel_kt: 0.16                     # Nm/A (17T 官方转矩常数)
    wheel_max_torque_nm: 2.2           # Nm (17T 最大转矩)
    wheel_mf_max_current_a: 16.5       # A (Broadcast Current +/-2000 对应的满量程电流)

    # ==========================================================================
    # EcatV2_Master 12 个电机与控制指令 ROS 2 话题映射
    # 转向/偏心顺序: [LF, RF, LB, RB]；轮毂 Broadcast Current 对应 Motor ID 1..4 = [LF, RF, LB, RB]
    # 需与 EcatV2_Master/src/soem_wrapper/config/config.yaml 中的 pub_topic / sub_topic 一致
    # ==========================================================================
    chassis_cmd_read_topic: "robox_chassis_command"
    imu_read_topic: "/imu"

    steer_motor_read_topics:
      - "/ecat/steer_lf/state"
      - "/ecat/steer_rf/state"
      - "/ecat/steer_lb/state"
      - "/ecat/steer_rb/state"
    steer_motor_write_topics:
      - "/ecat/steer_lf/cmd"
      - "/ecat/steer_rf/cmd"
      - "/ecat/steer_lb/cmd"
      - "/ecat/steer_rb/cmd"

    ecc_motor_read_topics:
      - "/ecat/ecc_lf/state"
      - "/ecat/ecc_rf/state"
      - "/ecat/ecc_lb/state"
      - "/ecat/ecc_rb/state"
    ecc_motor_write_topics:
      - "/ecat/ecc_lf/cmd"
      - "/ecat/ecc_rf/cmd"
      - "/ecat/ecc_lb/cmd"
      - "/ecat/ecc_rb/cmd"

    wheel_motor_read_topic: "/ecat/wheel_motors/state"
    wheel_motor_write_topic: "/ecat/wheel_motors/cmd"

    # ==========================================================================
    # HiPNUC CH010 IMU (G431 CAN 转发板, app_id=3)
    # 车体坐标系为 FLU (+X前 / +Y左 / +Z上)
    # 若 CH010 壳体丝印 +X 朝车头正前方、+Z 朝上，imu_mount_rpy_deg 保持 [0, 0, 0]
    # ==========================================================================
    require_imu_for_homing: true
    imu_mount_rpy_deg: [0.0, 0.0, 0.0] # [roll, pitch, yaw] deg (IMU系 -> 车体FLU系)
    imu_lever_arm: [0.0, 0.0, 0.0]     # [dx, dy, dz] m (IMU 相对底盘中心偏移)

    # 业务默认参数
    default_payload_mass: 0.0
    default_posture_mode: 0
    default_climb_mode: 1
    default_curb_height: 0.075

robox_hub_controller:
  ros__parameters:
    # ==========================================================================
    # SBUS 遥控器 (EcatV2_Master SBUS_RC, app_id=11) 与速度平滑参数
    # 通道索引从 0 开始 (Ch1=0, Ch2=1 ...)，设为 -1 可禁用该通道映射
    # ==========================================================================
    sbus_enabled: true
    sbus_read_topic: "/ecat/sbus_rc"
    external_cmd_read_topic: "external_robox_command"
    chassis_cmd_write_topic: "robox_chassis_command"

    sbus_failsafe_estop: true
    sbus_timeout: 0.5
    external_cmd_timeout: 0.5
    sbus_ch_min: 172.0                 # 标准 SBUS 最小/中位/最大值 (如为 1000/1500/2000 相应调整)
    sbus_ch_mid: 992.0
    sbus_ch_max: 1811.0
    sbus_deadband: 0.05

    sbus_ch_vx: 1                      # 前后 (Ch2)
    sbus_ch_vy: 0                      # 左右横移 (Ch1)
    sbus_ch_wz: 3                      # 转向角速度 (Ch4)
    sbus_ch_height: 2                  # 机身高度调节 (Ch3; 若固定高度可设 -1)
    sbus_ch_estop: 4                   # 急停拨杆 (Ch5; > 0.5 触发急停)
    sbus_ch_climb_mode: 5              # 攀爬模式三段开关 (Ch6: 低=关, 中=常规, 高=200mm)
    sbus_ch_spin: 6                    # 小陀螺三段开关 (Ch7: 低=顺时针, 中=关, 高=逆时针)
    sbus_ch_posture: 7                 # 姿态模式三段开关 (Ch8: 低=OUTWARD, 中=INWARD, 高=STRAFE)

    sbus_inv_vx: false
    sbus_inv_vy: false
    sbus_inv_wz: false
    sbus_inv_height: false
    sbus_inv_estop: false
    sbus_height_min: 0.084
    sbus_height_max: 0.22

    default_body_height: 0.175
    default_posture_mode: 0
    default_climb_mode: 1
    default_curb_height: 0.075
    default_payload_mass: 0.0

    teleop_max_vx: 1.2                 # m/s
    teleop_max_vy: 1.0                 # m/s
    teleop_max_wz: 2.0                 # rad/s
    teleop_accel_lin_fwd: 2.6          # m/s^2
    teleop_accel_lin_brake: 2.8        # m/s^2
    teleop_accel_strafe: 2.2           # m/s^2
    teleop_accel_angular: 12.0         # rad/s^2
    teleop_max_lateral_acc: 3.0        # m/s^2 (过弯离心保护 |vx * wz| <= 3.0)
